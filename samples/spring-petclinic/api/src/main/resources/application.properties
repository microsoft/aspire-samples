spring.application.name=petclinic-api
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false
scalar.page-title=Spring Petclinic API
scalar.agent.disabled=true
# Run-mode demo endpoints for the dashboard commands. The AppHost sets PETCLINIC_DEMO_ENABLED=true.
petclinic.demo.enabled=false
