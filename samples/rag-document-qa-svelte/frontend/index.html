<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Contoso Handbook Q&amp;A: ask questions about company policies and get answers grounded in cited passages, using retrieval-augmented generation on Aspire." />
    <!-- Inline SVG favicon avoids a /favicon.ico 404 in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 8h5v16H9zM15.5 8h5v16h-5zM22 9.2l3.3-.9 3.2 14.8-3.3.9z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Contoso Handbook Q&amp;A</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('handbook-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored || (prefersLight ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
