[project]
name = "worker-python"
version = "0.1.0"
description = "Python worker for the polyglot task queue: profiles CSV datasets with pandas"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "pandas>=3.0.3",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-logging>=0.66b2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0"
]