variables:
  # Keep these aligned with .github/workflows/ci.yml.
  - name: AspireCliVersion
    value: '13.5.0'
  - name: NodeVersion
    value: '24.18.0'
  - ${{ if eq(variables['System.TeamProject'], 'public') }}:
    - name: PoolProvider
      value: NetCore-Public
  - ${{ if ne(variables['System.TeamProject'], 'public') }}:
    - name: PoolProvider
      value: NetCore1ESPool-Internal

trigger:
- main

pr: none

# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
          name: $(PoolProvider)
          image: 1es-windows-2022
          os: windows
    sdl:
      policheck:
        enabled: true
        exclusionsFile: $(Build.SourcesDirectory)\.config\PoliCheckExclusions.xml
      eslint:
        enabled: true
        enableExclusions: true
        exclusionPatterns: |
          **/jquery*.js
          **/angular*.js
      sbom:
       # opting-out of SBOM generation as we don't produce artifacts
        enabled: false
      tsa:
        enabled: true        

    stages:
    - stage: build
      displayName: Build
      jobs:
      - job: Windows
        timeoutInMinutes: 60
        variables:
          DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
          ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
          ${{ if ne(variables['System.TeamProject'], 'public') }}:
            NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)\eng\internal\.npmrc
        
        steps:
        - checkout: self
          clean: true
        - ${{ if ne(variables['System.TeamProject'], 'public') }}:
          - powershell: |
              Copy-Item -LiteralPath "$(Build.SourcesDirectory)\eng\internal\NuGet.config" -Destination "$(Build.SourcesDirectory)\nuget.config" -Force -ErrorAction Stop
            displayName: Use Azure DevOps NuGet feeds
        - task: UseDotNet@2
          displayName: Install global.json SDK
          inputs:
            useGlobalJson: true
            workingDirectory: $(Build.SourcesDirectory)/build
        - task: NodeTool@0
          displayName: Install Node.js
          inputs:
            versionSpec: $(NodeVersion)
        - ${{ if ne(variables['System.TeamProject'], 'public') }}:
          - task: npmAuthenticate@0
            displayName: Authenticate Azure DevOps npm feed
            inputs:
              workingFile: $(Build.SourcesDirectory)\eng\internal\.npmrc
        - powershell: |
              $toolPath = "$(Agent.TempDirectory)\aspire-cli"
              dotnet tool install Aspire.Cli --version "$(AspireCliVersion)" --tool-path "$toolPath" --configfile "$(Build.SourcesDirectory)\nuget.config"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              $aspirePath = Join-Path $toolPath 'aspire.cmd'
              & $aspirePath --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              Write-Host "##vso[task.setvariable variable=ASPIRE_CLI]$aspirePath"
          displayName: Install Aspire CLI
        - powershell: |
              $(Build.SourcesDirectory)/build/build.cmd
          displayName: build.cmd
