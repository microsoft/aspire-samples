id: label.prs
name: GitOps.PullRequestIssueManagement
description: Label management for pull requests
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:

      - description: >-
          Label Dependabot pull requests with 'dependencies'. The Aspire Bot control plane
          (.github/workflows/aspire-bot-control.yml) decides whether to merge them, based on
          ASPIRE_BOT_MODE and the PR's risk tier.
        if:
          - payloadType: Pull_Request
          - isAction:
              action: Opened
          - or:
            - isActivitySender:
                user: dependabot
            - isActivitySender:
                user: dependabot[bot]
        then:
          - addLabel:
              label: dependencies

      - description: >-
          Label Dependabot issues with 'dependencies'
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
          - or:
            - isActivitySender:
                user: dependabot
            - isActivitySender:
                user: dependabot[bot]
        then:
          - addLabel:
              label: dependencies
