id: auto.merge
name: GitOps.PullRequestIssueManagement
description: Auto-merge pull requests labeled 'auto-merge' after the required CI Gate passes
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:

      - description: >-
          Approve and auto-squash-merge PRs to main labeled 'auto-merge'.
          Maintainers may apply the label manually to their own PRs. This rule skips Aspire Bot
          ('aspire-bot' label) and Dependabot ('dependencies' label) PRs: only the Aspire Bot control
          plane (.github/workflows/aspire-bot-control.yml) merges them, with a SHA-pinned merge, and it
          removes this label and disables GitHub auto-merge on them.
          Branch protection requires CI Gate to pass on the PR branch without
          requiring it to be up to date with main before merging.
        triggerOnOwnActions: true
        if:
          - payloadType: Pull_Request
          - labelAdded:
              label: auto-merge
          - targetsBranch:
              branch: main
          - not:
              hasLabel:
                label: aspire-bot
          - not:
              hasLabel:
                label: dependencies
        then:
          - enableAutoMerge:
              mergeMethod: Squash
          - approvePullRequest:
              comment: "Approved; this PR will merge after the required CI Gate passes."

      - description: Disable auto-merge when the 'auto-merge' label is removed
        if:
          - payloadType: Pull_Request
          - labelRemoved:
              label: auto-merge
        then:
          - disableAutoMerge
